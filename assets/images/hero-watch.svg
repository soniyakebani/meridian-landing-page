<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" role="img"
     aria-label="Meridian Tide 2 dive watch showing a tide curve and a depth readout">
  <defs>
    <linearGradient id="caseMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9D6D4"/>
      <stop offset="38%" stop-color="#8FA6A6"/>
      <stop offset="62%" stop-color="#D7E2DF"/>
      <stop offset="100%" stop-color="#7E9497"/>
    </linearGradient>
    <linearGradient id="bezelMetal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#123D48"/>
      <stop offset="50%" stop-color="#1C7C8C"/>
      <stop offset="100%" stop-color="#0B2830"/>
    </linearGradient>
    <radialGradient id="screenGlass" cx="0.32" cy="0.26" r="0.85">
      <stop offset="0%" stop-color="#14606E"/>
      <stop offset="55%" stop-color="#0C3A45"/>
      <stop offset="100%" stop-color="#071E26"/>
    </radialGradient>
    <linearGradient id="strapWeave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15454F"/>
      <stop offset="100%" stop-color="#0B2830"/>
    </linearGradient>
    <clipPath id="screenClip">
      <circle cx="230" cy="310" r="118"/>
    </clipPath>
  </defs>

  <!-- upper strap -->
  <path d="M148 120 h164 v120 h-164 z" fill="url(#strapWeave)"/>
  <path d="M148 12 q82 -18 164 0 v112 h-164 z" fill="url(#strapWeave)"/>
  <g stroke="#0B2830" stroke-width="2" opacity="0.55">
    <path d="M148 46 h164"/><path d="M148 74 h164"/><path d="M148 102 h164"/>
    <path d="M148 130 h164"/><path d="M148 158 h164"/>
  </g>

  <!-- lower strap -->
  <path d="M148 380 h164 v120 h-164 z" fill="url(#strapWeave)"/>
  <path d="M148 496 h164 v96 q-82 18 -164 0 z" fill="url(#strapWeave)"/>
  <g stroke="#0B2830" stroke-width="2" opacity="0.55">
    <path d="M148 462 h164"/><path d="M148 490 h164"/><path d="M148 518 h164"/>
    <path d="M148 546 h164"/>
  </g>

  <!-- case body -->
  <circle cx="230" cy="310" r="172" fill="url(#caseMetal)"/>
  <circle cx="230" cy="310" r="172" fill="none" stroke="#6B8285" stroke-width="3"/>

  <!-- crown and pushers -->
  <rect x="396" y="290" width="30" height="42" rx="8" fill="url(#caseMetal)" stroke="#6B8285" stroke-width="2"/>
  <rect x="392" y="232" width="22" height="30" rx="7" fill="#A8BBBB" stroke="#6B8285" stroke-width="2"/>
  <rect x="392" y="360" width="22" height="30" rx="7" fill="#A8BBBB" stroke="#6B8285" stroke-width="2"/>

  <!-- rotating dive bezel -->
  <circle cx="230" cy="310" r="152" fill="url(#bezelMetal)"/>
  <circle cx="230" cy="310" r="152" fill="none" stroke="#0B2830" stroke-width="2"/>

  <!-- bezel minute ticks -->
  <g stroke="#E7EFEC" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <g transform="rotate(30 230 310)"><path d="M230 170 v16"/></g>
    <g transform="rotate(60 230 310)"><path d="M230 170 v16"/></g>
    <g transform="rotate(90 230 310)"><path d="M230 170 v22"/></g>
    <g transform="rotate(120 230 310)"><path d="M230 170 v16"/></g>
    <g transform="rotate(150 230 310)"><path d="M230 170 v16"/></g>
    <g transform="rotate(180 230 310)"><path d="M230 170 v22"/></g>
    <g transform="rotate(210 230 310)"><path d="M230 170 v16"/></g>
    <g transform="rotate(240 230 310)"><path d="M230 170 v16"/></g>
    <g transform="rotate(270 230 310)"><path d="M230 170 v22"/></g>
    <g transform="rotate(300 230 310)"><path d="M230 170 v16"/></g>
    <g transform="rotate(330 230 310)"><path d="M230 170 v16"/></g>
  </g>

  <!-- zero marker pip -->
  <circle cx="230" cy="178" r="9" fill="#F2B705"/>

  <!-- screen -->
  <circle cx="230" cy="310" r="120" fill="#04141A"/>
  <circle cx="230" cy="310" r="118" fill="url(#screenGlass)"/>

  <g clip-path="url(#screenClip)">
    <!-- tide curve -->
    <path d="M100 356 q32 -62 66 0 q34 62 66 0 q32 -62 66 0 q34 62 66 0"
          fill="none" stroke="#F2B705" stroke-width="5" stroke-linecap="round"/>
    <path d="M100 356 q32 -62 66 0 q34 62 66 0 q32 -62 66 0 q34 62 66 0 v90 h-264 z"
          fill="#F2B705" opacity="0.13"/>
    <!-- horizon rule -->
    <path d="M100 356 h264" stroke="#7FB3B8" stroke-width="1.5" opacity="0.4"/>
    <!-- current position dot -->
    <circle cx="232" cy="356" r="7" fill="#F2B705"/>
    <circle cx="232" cy="356" r="14" fill="none" stroke="#F2B705" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- screen readouts -->
  <text x="230" y="272" text-anchor="middle" fill="#E7EFEC"
        font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1">18.4m</text>
  <text x="230" y="300" text-anchor="middle" fill="#7FB3B8"
        font-family="'IBM Plex Sans', Arial, sans-serif"
        font-size="19" letter-spacing="1.5">depth · 14°C</text>
  <text x="230" y="404" text-anchor="middle" fill="#9FC6C9"
        font-family="'IBM Plex Sans', Arial, sans-serif"
        font-size="18">high water 16:42</text>

  <!-- glass highlight -->
  <path d="M132 250 a118 118 0 0 1 96 -58 a150 150 0 0 0 -96 118 z"
        fill="#FAFCFB" opacity="0.10"/>
</svg>
